members:
  - id: lin-shu-fen
    name: 林 淑芬
    role: 研究代表者
    affiliation: 国立成功大学 環境工学科
    country: tw
    bio: >-
      産業部門の排出インベントリ手法を二十年研究。国際比較における対立の多くは政治的立場ではなく統計定義の問題であり、それが明示されないまま放置されていると主張する。三か国の境界調和規則を統括。
    tags: [排出インベントリ, 産業エコロジー]
  - id: chen-yao-ting
    name: 陳 耀庭
    role: 台湾チーム代表
    affiliation: 中央研究院 経済研究所
    country: tw
    bio: >-
      環境経済学と炭素価格設計が専門。義務的炭素価格のない条件下での投資行動を追跡し、削減の一部が効率改善ではなく生産量の低下に由来するという扱いにくい発見に取り組む。
    tags: [環境経済学, 炭素価格]
  - id: hsu-wan-ju
    name: 許 婉如
    role: 社会的コスト評価担当
    affiliation: 国立高雄大学 政治法律学科
    country: tw
    bio: >-
      石油化学コンビナート周辺地域の環境正義を長年研究。代表六拠点の住民聞き取りと地方財政分析を担当し、「誰が移行コストを負担するのか」を比較の枠組みに含めるべきだと主張する。
    tags: [環境正義, 地域研究]
  - id: whitfield-eleanor
    name: Eleanor Whitfield
    role: 英国チーム代表
    affiliation: マンチェスター大学 ティンダルセンター
    country: uk
    bio: >-
      UK ETS が重工業の投資判断に与える影響を研究。削減を炭素価格に帰属させることには慎重で、生産拠点の海外移転が帳簿上の削減を統計的な移動に変える過程に注目する。
    tags: [排出量取引, 産業政策]
  - id: okonkwo-daniel
    name: Daniel Okonkwo
    role: データ手法担当
    affiliation: インペリアル・カレッジ・ロンドン 環境政策センター
    country: uk
    bio: >-
      調和パイプラインと公開データ基盤を構築。すべての調整を元の数値まで逆算可能にすること、そして調和規則そのものを反論可能な公開文書として書くことを担う。
    tags: [データ手法, オープンサイエンス]
  - id: bennett-clare
    name: Clare Bennett
    role: 政策分析研究員
    affiliation: リーズ大学 地球環境学部
    country: uk
    bio: >-
      補助金と移行基金を企業の資本支出の時期と突き合わせる。政策の表明から実際の投資までに三〜五年の遅れがあり、多くの比較研究がこれを見落としていると指摘する。
    tags: [政策分析, 投資判断]
  - id: ishikawa-mari
    name: 石川 真理
    role: 日本チーム代表
    affiliation: 東京大学 生産技術研究所
    country: jp
    bio: >-
      日本の石油化学業界における自主行動計画制度を研究。特定の条件下では自主的枠組みが義務的規制を上回る達成率を示すという、外部から誤読されやすい現象を説明する。その条件は容易には再現できない。
    tags: [産業制度, 自主規制]
  - id: takahashi-ken
    name: 高橋 健
    role: 排出モデル研究員
    affiliation: 国立環境研究所 地球システム領域
    country: jp
    bio: >-
      日本側拠点の排出インベントリとモデル校正を担当。自家発電排出の帰属をめぐる技術的論点に長く取り組んでおり、三か国の調和過程で最も合意が難しかった項目でもある。
    tags: [排出モデル, エネルギーシステム]
  - id: nomura-aya
    name: 野村 彩
    role: 国際調整研究員
    affiliation: 一橋大学 経済学研究科
    country: jp
    bio: >-
      三チームの合同会議と留保記録を担当。方法論文書に「未解決の相違」一覧を維持し、無理に収束させるより合意がない点を正直に示すほうが価値があるという立場をとる。
    tags: [比較研究, 研究調整]
