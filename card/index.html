<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --cream:#faf6f1;
  --blush:#e8cfc0;
  --blush-light:#f3e4db;
  --gold:#c9a96e;
  --gold-muted:#d4bc8b;
  --gold-glow:rgba(201,169,110,.35);
  --text:#5a4a3f;
  --text-light:#8a7a6f;
}

html{scroll-behavior:smooth;scrollbar-width:none}
html::-webkit-scrollbar{display:none}
body{
  font-family:'Noto Serif TC','Cormorant Garamond',serif;
  background:var(--cream);
  color:var(--text);
  overflow-x:hidden;
  -webkit-user-select:none;user-select:none;
}

  :root,html,body,*,*::before,*::after{

  }

  }
}

/* ── 背景 (fixed) ── */
.bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 50% at 30% 20%,rgba(232,207,192,.45),transparent),
    radial-gradient(ellipse 50% 60% at 75% 70%,rgba(201,169,110,.18),transparent),
    radial-gradient(ellipse 80% 80% at 50% 50%,rgba(243,228,219,.5),transparent),
    linear-gradient(160deg,#faf6f1 0%,#f5ede4 40%,#f0e5d8 100%);
}

/* ── 視差光暈 ── */
.glow{
  position:fixed;z-index:0;pointer-events:none;
  border-radius:50%;filter:blur(80px);opacity:.5;
  will-change:transform;
}
.glow--1{width:420px;height:420px;top:-80px;left:-60px;background:rgba(232,207,192,.55)}
.glow--2{width:350px;height:350px;bottom:-60px;right:-40px;background:rgba(201,169,110,.3)}
.glow--3{width:260px;height:260px;top:40%;left:55%;background:rgba(243,228,219,.6)}

/* ── Canvas 粒子 ── */
#particles{position:fixed;inset:0;z-index:30;pointer-events:none}

/* ── 視差裝飾符號 ── */
.parallax-symbol{
  position:fixed;z-index:1;pointer-events:none;
  color:var(--gold-muted);opacity:0;
  will-change:transform;
}

/* ══════════════════════════════
   Section 共用
   ══════════════════════════════ */
section{
  position:relative;z-index:2;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:100vh;
  padding:4rem 1.5rem;
}

/* ── Section 1: Hero ── */
.hero{min-height:100vh;text-align:center;gap:1.2rem}
.hero__date{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(.8rem,2vw,.9rem);
  letter-spacing:.2em;
  color:var(--gold-muted);
  margin-top:.8rem;opacity:0;
}
.hero__eyebrow{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(.85rem,2vw,.95rem);
  letter-spacing:.3em;text-transform:uppercase;
  color:var(--gold);opacity:0;
}
.hero__title{
  font-family:'Cormorant Garamond','Noto Serif TC',serif;
  font-weight:600;font-size:clamp(2.4rem,7vw,4rem);
  letter-spacing:.08em;color:var(--text);
  line-height:1.3;opacity:0;
}
.hero__sub{
  font-size:clamp(.9rem,2.5vw,1.1rem);
  color:var(--text-light);
  letter-spacing:.08em;line-height:2;
  max-width:400px;opacity:0;
}
.hero__scroll-hint{
  position:absolute;bottom:2.5rem;
  display:flex;flex-direction:column;align-items:center;gap:.5rem;
  color:var(--gold-muted);opacity:0;
}
.hero__scroll-hint span{
  font-size:.75rem;letter-spacing:.15em;
}
.scroll-arrow{
  width:20px;height:20px;
  border-right:1.5px solid var(--gold-muted);
  border-bottom:1.5px solid var(--gold-muted);
  transform:rotate(45deg);
  animation:scrollBounce 2s ease-in-out infinite;
}
@keyframes scrollBounce{
  0%,100%{transform:translateY(0) rotate(45deg)}
  50%{transform:translateY(6px) rotate(45deg)}
}

/* ── Section 2: 引言過渡 ── */
.interlude{min-height:60vh;text-align:center;gap:1rem}
.interlude__line{
  font-family:'Cormorant Garamond','Noto Serif TC',serif;
  font-size:clamp(1.1rem,3vw,1.5rem);
  color:var(--text-light);
  letter-spacing:.1em;line-height:2;
  opacity:0;
}
.interlude__divider{
  width:60px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold-muted),transparent);
  margin:1rem 0;opacity:0;
}

/* ── Section 3: 抽卡區 (pin) ── */
.card-section{
  min-height:100vh;
  gap:1.8rem;perspective:1000px;
}
.card-section__title{
  font-family:'Cormorant Garamond','Noto Serif TC',serif;
  font-weight:600;font-size:clamp(1.4rem,4vw,1.8rem);
  letter-spacing:.08em;color:var(--text);
  opacity:0;
}

/* ── 扇形牌區 ── */
.spread{
  position:relative;
  height:260px;width:100%;max-width:800px;
  display:flex;align-items:flex-end;justify-content:center;
}
.card-sm{
  width:110px;height:165px;
  position:absolute;bottom:0;

  transform-style:preserve-3d;
  transform-origin:center bottom;
  perspective:600px;
}
.card-sm:hover{filter:drop-shadow(0 0 22px var(--gold-glow)) brightness(1.05)}
.card-sm{will-change:transform,opacity}
.card-sm .card-face{
  position:absolute;inset:0;border-radius:12px;
  backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:1rem;
}
.card-sm .card-back{
  background:linear-gradient(145deg,var(--blush-light),var(--blush));
  border:1.5px solid var(--gold-muted);
  box-shadow:0 4px 20px rgba(90,74,63,.1);
}
.card-sm .card-back__inner{
  width:78%;height:78%;
  border:1px solid var(--gold-muted);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
}
.card-back__symbol{opacity:.3;color:var(--gold)}

/* ── 燈箱遮罩 ── */
.lightbox-backdrop{
  position:fixed;inset:0;z-index:18;
  background:radial-gradient(ellipse at center,rgba(40,32,26,.3),rgba(30,24,20,.5));
  opacity:0;pointer-events:none;
  transition:opacity .5s ease;
}
.lightbox-backdrop.active{opacity:1;pointer-events:auto}

/* ── 翻牌展示區 ── */
.reveal{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  z-index:20;pointer-events:none;opacity:0;
}
.reveal.active{pointer-events:auto}

/* 卡片背後柔光 */
.card-glow{
  position:absolute;top:50%;left:50%;
  width:360px;height:500px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(ellipse,rgba(201,169,110,.22) 0%,rgba(232,207,192,.08) 40%,transparent 70%);
  opacity:0;pointer-events:none;
  z-index:-1;
}

.card-lg{
  width:260px;height:390px;
  transform-style:preserve-3d;position:relative;
}
.card-lg .card-face{
  position:absolute;inset:0;border-radius:18px;
  backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2rem;
  box-shadow:0 16px 60px rgba(90,74,63,.2), 0 0 80px rgba(201,169,110,.1);
}
.card-lg .card-back{
  background:linear-gradient(145deg,var(--blush-light),var(--blush));
  border:1.5px solid var(--gold-muted);
}
.card-lg .card-back__inner{
  width:80%;height:80%;
  border:1px solid var(--gold-muted);border-radius:10px;
  display:flex;align-items:center;justify-content:center;
}
.card-lg .card-front{
  background:linear-gradient(160deg,#fffcf8,#faf3ec);
  border:1.5px solid var(--gold-muted);
  transform:rotateY(180deg);text-align:center;gap:1rem;
}
.card-front__icon{color:var(--gold);opacity:.7;margin-bottom:.5rem}
.card-front__keyword{
  font-family:'Cormorant Garamond','Noto Serif TC',serif;
  font-size:1.8rem;font-weight:600;
  letter-spacing:.14em;color:var(--text);
}
.card-front__phrase{
  font-size:.95rem;line-height:2;
  color:var(--text-light);letter-spacing:.05em;max-width:90%;
}

/* Scroll lock */
body.scroll-locked{overflow:hidden}

/* ── 按鈕 ── */
.btn{
  font-family:'Noto Serif TC',serif;
  font-size:.95rem;letter-spacing:.12em;
  color:#fff;
  background:linear-gradient(135deg,var(--gold),var(--gold-muted));
  border:none;border-radius:40px;
  padding:.8rem 2.6rem;
  transition:all .3s ease;
  opacity:0;visibility:hidden;
  position:fixed;bottom:8%;left:50%;transform:translateX(-50%);z-index:25;
  box-shadow:0 4px 20px rgba(201,169,110,.35), 0 0 40px rgba(201,169,110,.15);
}
.btn:hover{
  background:linear-gradient(135deg,var(--gold-muted),var(--gold));
  box-shadow:0 6px 28px rgba(201,169,110,.5), 0 0 50px rgba(201,169,110,.2);
  transform:translateX(-50%) translateY(-2px);
}

/* ── Section 4: 尾聲 ── */
.outro{min-height:100vh;text-align:center;gap:1.2rem}
.outro__text{
  font-family:'Cormorant Garamond','Noto Serif TC',serif;
  font-size:clamp(1.2rem,3.5vw,1.7rem);
  color:var(--text-light);
  letter-spacing:.08em;line-height:2;
  max-width:460px;opacity:0;
}
.outro__sig{
  font-size:.85rem;color:var(--gold-muted);
  letter-spacing:.2em;opacity:0;
}

/* ── 手機適配 ── */
@media(max-width:520px){
  .spread{height:200px}
  .card-sm{width:80px;height:120px}
  .card-lg{width:200px;height:300px}
  .card-front__keyword{font-size:1.3rem}
  .card-front__phrase{font-size:.84rem}
}
</style>
</head>

/* ══════════════════════════════════════
   發牌邏輯
   ══════════════════════════════════════ */
function shufflePick(arr, n) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy.slice(0, n);
}

// 粒子 COLORS（提前宣告供 hover 用）
const COLORS = [
  [180, 145, 75], [160, 120, 60], [190, 155, 100], [170, 130, 90]
];

// 每張牌的散落起始位置（隨機生成）
function randomScatter(index) {
  const side = index < CARD_COUNT / 2 ? -1 : 1;
  return {
    x: side * (300 + Math.random() * 300),
    y: -200 + Math.random() * 400,
    rotation: (Math.random() - 0.5) * 100,
    scale: 0.4 + Math.random() * 0.15,
  };
}

function createSmallCard(index) {
  const wrap = document.createElement('div');
  wrap.className = 'card-sm';
  wrap.setAttribute('role', 'button');
  wrap.setAttribute('tabindex', '0');
  wrap.setAttribute('aria-label', `抽第 ${index + 1} 張牌`);
  wrap.innerHTML = `
    <div class="card-face card-back">
      <div class="card-back__inner">
        <svg class="card-back__symbol" width="36" height="36" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.2">
          <circle cx="24" cy="24" r="10"/>
          <line x1="24" y1="6" x2="24" y2="14"/><line x1="24" y1="34" x2="24" y2="42"/>
          <line x1="6" y1="24" x2="14" y2="24"/><line x1="34" y1="24" x2="42" y2="24"/>
        </svg>
      </div>
    </div>`;

  const mid = (CARD_COUNT - 1) / 2;
  const angle = FAN_ANGLES[index];
  const yOff  = FAN_Y[index];
  const xOff  = (index - mid) * 45;

  // 設定散落初始狀態
  const scatter = randomScatter(index);
  wrap._fanTarget = { x: xOff, y: yOff, rotation: angle, scale: 1, opacity: 1 };
  wrap._scatter   = scatter;

  gsap.set(wrap, { x: scatter.x, y: scatter.y, rotation: scatter.rotation, scale: scatter.scale, opacity: 0.35 });

  wrap.addEventListener('click', () => selectCard(index));
  wrap.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectCard(index); }
  });

  wrap.addEventListener('mouseenter', () => {
    if (isAnimating || !cardsGathered) return;
    gsap.to(wrap, { y: yOff - 22, scale: 1.08, rotateX: -5, duration: 0.4, ease: 'power2.out' });
  });

  wrap.addEventListener('mouseleave', () => {
    if (isAnimating || !cardsGathered) return;
    gsap.to(wrap, { y: yOff, scale: 1, rotateX: 0, rotateY: 0, duration: 0.4, ease: 'sine.inOut' });
  });

  wrap.addEventListener('mousemove', (e) => {
    if (isAnimating || !cardsGathered) return;
    const rect = wrap.getBoundingClientRect();
    const rx = ((e.clientY - rect.top) / rect.height - 0.5) * -12;
    const ry = ((e.clientX - rect.left) / rect.width - 0.5) * 12;
    gsap.to(wrap, { rotateX: rx, rotateY: ry, duration: 0.2, ease: 'power2.out' });
  });

  return wrap;
}

let cardsGathered = false;
let gatherTrigger = null;
let breathTrigger = null;

function dealCards() {
  spread.innerHTML = '';
  currentCards = [];
  currentData = shufflePick(CARDS, CARD_COUNT);
  cardsGathered = false;

  for (let i = 0; i < CARD_COUNT; i++) {
    const el = createSmallCard(i);
    spread.appendChild(el);
    currentCards.push(el);
  }

  // 建立 scrub 聚集動畫 timeline
  const gatherTl = gsap.timeline({ paused: true });
  currentCards.forEach((el, i) => {
    const t = el._fanTarget;
    gatherTl.to(el, {
      x: t.x, y: t.y, rotation: t.rotation,
      scale: t.scale, opacity: t.opacity,
      duration: 1, ease: 'power2.out',
    }, i * 0.06);
  });

  // 清除舊的聚集 trigger
  if (gatherTrigger) gatherTrigger.kill();

  gatherTrigger = ScrollTrigger.create({
    trigger: '#cardSection',
    start: 'top 95%',
    end: 'top 5%',
    scrub: 1.2,
    animation: gatherTl,
    onUpdate: (self) => {
      if (self.progress > 0.85) cardsGathered = true;
      else cardsGathered = false;
    },
  });

  // 聚集完成後啟動呼吸浮動（四方向一致）
  if (breathTrigger) breathTrigger.kill();
  const startBreath = () => {
    gsap.killTweensOf(spread);
    gsap.to(spread, { y: -6, duration: 2.4, ease: 'sine.inOut', yoyo: true, repeat: -1 });
  };
  const stopBreath = () => {
    gsap.killTweensOf(spread);
    gsap.set(spread, { y: 0 });
  };
  breathTrigger = ScrollTrigger.create({
    trigger: '#cardSection',
    start: 'top 20%',
    end: 'bottom bottom',
    onEnter: startBreath,
    onEnterBack: startBreath,
    onLeave: stopBreath,
    onLeaveBack: stopBreath,
  });
}

// 快速發牌（重抽時用，跳過聚集動畫直接到位）
function dealCardsInstant() {
  if (gatherTrigger) { gatherTrigger.kill(); gatherTrigger = null; }
  if (breathTrigger) { breathTrigger.kill(); breathTrigger = null; }
  currentCards.forEach(el => gsap.killTweensOf(el));
  gsap.killTweensOf(spread);
  spread.innerHTML = '';
  currentCards = [];
  currentData = shufflePick(CARDS, CARD_COUNT);
  cardsGathered = true;

  const mid = (CARD_COUNT - 1) / 2;
  for (let i = 0; i < CARD_COUNT; i++) {
    const el = createSmallCard(i);
    const t = el._fanTarget;
    gsap.set(el, { x: t.x, y: t.y, rotation: t.rotation, scale: 1, opacity: 0 });
    spread.appendChild(el);
    currentCards.push(el);
  }
  gsap.to(currentCards, {
    opacity: 1, duration: 0.5, stagger: 0.06, ease: 'power2.out'
  });
  gsap.to(spread, { y: -6, duration: 2.4, ease: 'sine.inOut', yoyo: true, repeat: -1 });
}

/* ══════════════════════════════════════
   選牌 → 翻牌
   ══════════════════════════════════════ */
function selectCard(index) {
  if (isAnimating) return;
  isAnimating = true;

  // 鎖定捲動
  document.body.classList.add('scroll-locked');

  const data = currentData[index];
  const chosen = currentCards[index];

  gsap.killTweensOf(spread);
  gsap.set(spread, { y: 0 });

  cardIcon.innerHTML = data.icon;
  cardKw.textContent = data.keyword;
  cardPh.textContent = '';
  cardPh.dataset.fullText = data.phrase;

  // 重置大牌與光效
  gsap.set(revealCard, { rotateY: 0, scale: 0.7 });
  gsap.set(reveal, { opacity: 0 });
  gsap.set([cardIcon, cardKw], { opacity: 0 });
  gsap.set(cardGlow, { opacity: 0, scale: 0.5 });
  reveal.classList.add('active');

  const tl = gsap.timeline();

  // 其餘牌淡出
  currentCards.forEach((el, i) => {
    if (i !== index) {
      tl.to(el, { opacity: 0, y: 20, scale: 0.85, duration: 0.4, ease: 'power2.out' }, 0);
    }
  });

  tl
    // 被選牌上浮淡出
    .to(chosen, { opacity: 0, y: -30, scale: 1.1, duration: 0.5, ease: 'power2.out' }, 0.2)
    // 燈箱遮罩淡入
    .call(() => backdrop.classList.add('active'), [], 0.3)
    // 大牌從小到大彈入
    .to(reveal, { opacity: 1, duration: 0.5, ease: 'sine.inOut' }, 0.5)
    .to(revealCard, { scale: 1, duration: 0.8, ease: 'power2.out' }, 0.5)
    // 背後光暈擴散
    .to(cardGlow, { opacity: 1, scale: 1, duration: 1, ease: 'power2.out' }, 0.6)
    // 3D 翻轉
    .to(revealCard, { rotateY: 180, duration: 1.1, ease: 'power2.out' }, 1)
    // 翻牌瞬間光暈脈衝
    .to(cardGlow, { scale: 1.4, opacity: 0.8, duration: 0.3, ease: 'power2.out' }, 1.8)
    .to(cardGlow, { scale: 1, opacity: 0.5, duration: 0.6, ease: 'sine.inOut' }, 2.1)
    // 粒子爆發
    .call(() => {
      const r = revealCard.getBoundingClientRect();
      emitBurst(r.left + r.width / 2, r.top + r.height / 2);
    }, [], 1.8)
    // icon 淡入
    .to(cardIcon, { opacity: 0.7, duration: 0.5, ease: 'power2.out' }, 1.9)
    // 關鍵字淡入
    .fromTo(cardKw, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, 2)
    // 逐字淡入
    .call(revealText, [], 2.2)
    // 光暈持續呼吸
    .to(cardGlow, {
      scale: 1.1, opacity: 0.6, duration: 2,
      ease: 'sine.inOut', yoyo: true, repeat: -1
    }, 2.5)
    // 按鈕
    .to(btnReset, { opacity: 1, visibility: 'visible', duration: 0.6, ease: 'sine.inOut' }, 2.8)
    .call(() => { isAnimating = false; });
}

function revealText() {
  const text = cardPh.dataset.fullText;
  cardPh.innerHTML = '';
  const spans = [];
  for (const ch of text) {
    if (ch === '\n') { cardPh.appendChild(document.createElement('br')); continue; }
    const span = document.createElement('span');
    span.textContent = ch;
    span.style.opacity = '0';
    span.style.display = 'inline-block';
    if (ch === ' ') span.style.width = '.25em';
    cardPh.appendChild(span);
    spans.push(span);
  }
  gsap.to(spans, { opacity: 1, duration: 0.05, stagger: 0.04, ease: 'power2.out', delay: 0.1 });
}

/* ══════════════════════════════════════
   重抽
   ══════════════════════════════════════ */
function closeLightbox() {
  if (isAnimating) return;
  isAnimating = true;
  const tl = gsap.timeline({
    onComplete() {
      reveal.classList.remove('active');
      backdrop.classList.remove('active');
      gsap.set(reveal, { opacity: 0, y: 0 });
      gsap.set(cardGlow, { opacity: 0 });
      gsap.killTweensOf(cardGlow);
      document.body.classList.remove('scroll-locked');
      dealCardsInstant();
      isAnimating = false;
    }
  });
  tl.to(btnReset, { opacity: 0, visibility: 'hidden', duration: 0.3, ease: 'power2.out' })
    .to(cardGlow, { opacity: 0, scale: 0.5, duration: 0.4, ease: 'power2.out' }, 0)
    .to(reveal, { opacity: 0, y: -20, scale: 0.9, duration: 0.5, ease: 'power2.out' }, 0.1)
    .set(reveal, { y: 0, scale: 1 });
}

btnReset.addEventListener('click', closeLightbox);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && reveal.classList.contains('active')) closeLightbox();
});

const CLICK_RADIUS = 250;

let lastPageX = -999, lastPageY = -999;

document.addEventListener('mousemove', (e) => {
  mouseX = e.clientX; mouseY = e.clientY;
  lastPageX = e.pageX; lastPageY = e.pageY;
});
document.addEventListener('mouseleave', () => {
  mouseX = -999; mouseY = -999; lastPageX = -999;
});
// 捲動時根據 page 座標重算 client 座標，保持仙女棒跟隨游標
window.addEventListener('scroll', () => {
  if (lastPageX > -900) {
    mouseX = lastPageX - window.scrollX;
    mouseY = lastPageY - window.scrollY;
  }
}, { passive: true });
document.addEventListener('click', (e) => {
  clickWaves.push({ x: e.clientX, y: e.clientY, time: performance.now() });
});

/* ── 漂浮微塵 ── */
const bgParticles = [];

function initBgParticles() {
  const count = Math.min(70, Math.floor(W * H / 14000));
  for (let i = 0; i < count; i++) {
    bgParticles.push({
      ox: Math.random() * W,          // 漂浮中心（持續移動）
      oy: Math.random() * H,
      x: 0, y: 0,                     // 實際繪製位置（含互動偏移）
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.25,
      baseSize: Math.random() * 2.5 + 1.2,
      size: 0,                         // 目前繪製大小
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      baseAlpha: Math.random() * 0.3 + 0.15,
      alpha: 0,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.012 + 0.006,
      pushX: 0, pushY: 0,             // 互動偏移量
    });
  }
}

function updateBgParticles(now, frame) {
  for (const p of bgParticles) {
    // 自然漂浮
    p.ox += p.vx;
    p.oy += p.vy;
    if (p.ox < -20) p.ox = W + 20;
    if (p.ox > W + 20) p.ox = -20;
    if (p.oy < -20) p.oy = H + 20;
    if (p.oy > H + 20) p.oy = -20;

    // 呼吸脈動
    const breathAlpha = p.baseAlpha + Math.sin(frame * p.speed + p.phase) * 0.12;

    // 滑鼠互動
    const dx = mouseX - p.ox;
    const dy = mouseY - p.oy;
    const dist = Math.sqrt(dx * dx + dy * dy);

    let targetSize = p.baseSize;
    let targetAlpha = breathAlpha;
    let targetPushX = 0;
    let targetPushY = 0;

    if (dist < MOUSE_RADIUS) {
      const t = 1 - dist / MOUSE_RADIUS;
      const ease = t * t;
      targetSize = p.baseSize + p.baseSize * 1.8 * ease;
      targetAlpha = Math.min(breathAlpha + 0.45 * ease, 0.85);
      if (dist > 1) {
        const push = ease * 12;
        targetPushX = -(dx / dist) * push;
        targetPushY = -(dy / dist) * push;
      }
    }

    // click 波紋
    for (const wave of clickWaves) {
      const elapsed = now - wave.time;
      if (elapsed > CLICK_DURATION) continue;
      const waveR = (elapsed / CLICK_DURATION) * CLICK_RADIUS;
      const wdx = p.ox - wave.x;
      const wdy = p.oy - wave.y;
      const wDist = Math.sqrt(wdx * wdx + wdy * wdy);
      const ringW = 60;
      const ringDist = Math.abs(wDist - waveR);
      if (ringDist < ringW) {
        const wt = 1 - ringDist / ringW;
        const fade = 1 - elapsed / CLICK_DURATION;
        targetSize = Math.max(targetSize, p.baseSize + p.baseSize * 1.5 * wt * fade);
        targetAlpha = Math.max(targetAlpha, breathAlpha + 0.4 * wt * fade);
        if (wDist > 1) {
          targetPushX += (wdx / wDist) * wt * fade * 15;
          targetPushY += (wdy / wDist) * wt * fade * 15;
        }
      }
    }

    // 平滑插值
    p.size   += (targetSize - p.size) * LERP;
    p.alpha  += (targetAlpha - p.alpha) * LERP;
    p.pushX  += (targetPushX - p.pushX) * LERP;
    p.pushY  += (targetPushY - p.pushY) * LERP;
    p.x = p.ox + p.pushX;
    p.y = p.oy + p.pushY;
  }

  clickWaves = clickWaves.filter(w => now - w.time < CLICK_DURATION);
}

function drawBgParticles() {
  for (const p of bgParticles) {
    const c = p.color;
    ctx.save();
    ctx.globalAlpha = p.alpha;
    // 被互動放大的粒子加光暈
    if (p.size > p.baseSize + 0.6) {
      ctx.shadowBlur = 10 + (p.size - p.baseSize) * 3;
      ctx.shadowColor = `rgba(${c.join(',')}, 0.7)`;
    }
    ctx.fillStyle = `rgba(${c.join(',')}, 1)`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

/* ── 翻牌爆發粒子 ── */
const burstParticles = [];

function emitBurst(cx, cy) {
  const count = 30 + Math.floor(Math.random() * 8);
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4.5 + 1.5;
    burstParticles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1,
      size: Math.random() * 4 + 2,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      life: 0, maxLife: 50 + Math.floor(Math.random() * 20)
    });
  }
}

function updateBurstParticles() {
  for (let i = burstParticles.length - 1; i >= 0; i--) {
    const p = burstParticles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.02; p.vx *= 0.985; p.vy *= 0.985;
    p.life++;
    if (p.life >= p.maxLife) p.dead = true;
  }
  const alive = burstParticles.filter(p => !p.dead);
  if (alive.length !== burstParticles.length) {
    burstParticles.length = 0;
    burstParticles.push(...alive);
  }
}

function drawBurstParticles() {
  for (const p of burstParticles) {
    const progress = p.life / p.maxLife;
    const alpha = 1 - progress;
    const size = p.size * (1 - progress * 0.6);
    ctx.save();
    ctx.globalAlpha = alpha * 0.9;
    ctx.shadowBlur = 16;
    ctx.shadowColor = `rgba(${p.color.join(',')}, 0.9)`;
    ctx.fillStyle = `rgba(${p.color.join(',')}, ${alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

/* ── 仙女棒火花 ── */
const sparkles = [];
let prevMouseX = -999, prevMouseY = -999;

const SPARK_COLORS = [
  [255, 230, 160],  // 亮金
  [240, 210, 140],  // 暖金
  [255, 245, 200],  // 近白
  [220, 185, 110],  // 深金
  [255, 220, 180],  // 蜜桃光
];

function spawnSparkles() {
  if (mouseX < -900) { prevMouseX = -999; return; }

  // 計算滑鼠移動速度
  const velX = prevMouseX > -900 ? mouseX - prevMouseX : 0;
  const velY = prevMouseY > -900 ? mouseY - prevMouseY : 0;
  const speed = Math.sqrt(velX * velX + velY * velY);

  prevMouseX = mouseX;
  prevMouseY = mouseY;

  // 移動越快產生越多火花（靜止時也有少量）
  const count = Math.min(4, Math.floor(speed * 0.3) + 1);

  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const v = Math.random() * 1.5 + 0.3;
    // 火花繼承一點滑鼠慣性
    const inheritX = velX * 0.15;
    const inheritY = velY * 0.15;

    sparkles.push({
      x: mouseX + (Math.random() - 0.5) * 6,
      y: mouseY + (Math.random() - 0.5) * 6,
      vx: Math.cos(angle) * v + inheritX,
      vy: Math.sin(angle) * v + inheritY - 0.5,  // 微微上飄
      size: Math.random() * 2.2 + 0.8,
      color: SPARK_COLORS[Math.floor(Math.random() * SPARK_COLORS.length)],
      life: 0,
      maxLife: 25 + Math.floor(Math.random() * 25),
      gravity: Math.random() * 0.04 + 0.02,
      spin: (Math.random() - 0.5) * 0.3,        // 微旋（畫星形時用）
      isStar: Math.random() < 0.3,               // 30% 機率是小星形
    });
  }
}

function updateSparkles() {
  for (let i = sparkles.length - 1; i >= 0; i--) {
    const s = sparkles[i];
    s.x += s.vx;
    s.y += s.vy;
    s.vy += s.gravity;    // 重力下墜
    s.vx *= 0.98;         // 空氣阻力
    s.vy *= 0.98;
    s.life++;
    if (s.life >= s.maxLife) sparkles.splice(i, 1);
  }
}

function drawSparkles() {
  for (const s of sparkles) {
    const progress = s.life / s.maxLife;
    const alpha = progress < 0.15
      ? progress / 0.15                          // 快速淡入
      : 1 - (progress - 0.15) / 0.85;            // 緩慢淡出
    const size = s.size * (1 - progress * 0.5);

    ctx.save();
    ctx.globalAlpha = alpha * 0.9;
    ctx.translate(s.x, s.y);

    // 光暈（降低 blur 值以提升效能）
    ctx.shadowBlur = 4 + size;
    ctx.shadowColor = `rgba(${s.color.join(',')}, ${alpha * 0.6})`;
    ctx.fillStyle = `rgba(${s.color.join(',')}, 1)`;

    if (s.isStar) {
      // 小四芒星
      ctx.rotate(s.spin * s.life);
      const r = size;
      const ri = r * 0.35;
      ctx.beginPath();
      for (let j = 0; j < 8; j++) {
        const a = (j * Math.PI) / 4;
        const rad = j % 2 === 0 ? r : ri;
        ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
      }
      ctx.closePath();
      ctx.fill();
    } else {
      // 圓形火花
      ctx.beginPath();
      ctx.arc(0, 0, size, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }
}

/* ── 主迴圈 ── */
let frame = 0;
let rafId = null;

function animate(now) {
  frame++;
  ctx.clearRect(0, 0, W, H);

  updateBgParticles(now, frame);
  drawBgParticles();

  spawnSparkles();
  updateSparkles();
  drawSparkles();

  updateBurstParticles();
  drawBurstParticles();

  rafId = requestAnimationFrame(animate);
}

function startLoop() { if (!rafId) rafId = requestAnimationFrame(animate); }
function stopLoop() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopLoop();
  } else {
    startLoop();
    if (lastPageX > -900) {
      mouseX = lastPageX - window.scrollX;
      mouseY = lastPageY - window.scrollY;
    }
  }
});
// bfcache 恢復時確保動畫迴圈運行
window.addEventListener('pageshow', (e) => {
  if (e.persisted) startLoop();
});

initBgParticles();
startLoop();
</script>
</body>
</html>
